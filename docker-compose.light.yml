version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smarttani
      POSTGRES_USER: smarttani_user
      POSTGRES_PASSWORD: smarttani_pass
    ports:
      - '5432:5432'
    volumes:
      - postgres_data_light:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smarttani_user -d smarttani']
      interval: 15s
      timeout: 5s
      retries: 3

  mongodb:
    image: mongo:7-jammy
    environment:
      MONGO_INITDB_ROOT_USERNAME: smarttani_user
      MONGO_INITDB_ROOT_PASSWORD: smarttani_pass
      MONGO_INITDB_DATABASE: smarttani
    ports:
      - '27017:27017'
    volumes:
      - mongo_data_light:/data/db
    deploy:
      resources:
        limits:
          memory: 128M

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 32mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data_light:/data
    deploy:
      resources:
        limits:
          memory: 64M

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: smarttani
      RABBITMQ_DEFAULT_PASS: smarttani_pass
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data_light:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          memory: 192M

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data_light:/data
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data_light:
  mongo_data_light:
  redis_data_light:
  rabbitmq_data_light:
  minio_data_light:

networks:
  default:
    name: smarttani-network
    driver: bridge
